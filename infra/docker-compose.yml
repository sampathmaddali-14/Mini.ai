# Mini.ai — optional auxiliary storage (Phase 1b)
#
# v0.1 runs everything on the host — see ../docs/install.md.
# This file is kept around for Phase 1b experiments where we may want
# Qdrant (richer vector ops) or Kuzu (richer graph queries) beyond the
# MemOS Local plugin's bundled SQLite store.
#
# v0.1 does NOT need either of these services. Do not start them unless
# you're explicitly working on Phase 1b storage migration.
#
# To start (Phase 1b only):
#   docker compose -f infra/docker-compose.yml up -d qdrant kuzu

name: mini-ai-aux

networks:
  mini:
    driver: bridge

volumes:
  qdrant_data:
  kuzu_data:

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mini-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # REST
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - mini

  kuzu:
    image: kuzudb/api-server:latest
    container_name: mini-kuzu
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - kuzu_data:/database
    environment:
      KUZU_DATABASE_PATH: /database/mini.kuzu
    networks:
      - mini
